services:
  mysql:
    image: mysql:8.4.3
    environment:
      MYSQL_DATABASE: ${DB_NAME:-user_management}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_local_only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root_local_only}
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-change_me_root_local_only}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-evaluation}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-user_management}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-app_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-change_me_local_only}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-replace-with-local-evaluation-secret-at-least-32-bytes}
    ports:
      - "${APP_PORT:-8080}:8080"
